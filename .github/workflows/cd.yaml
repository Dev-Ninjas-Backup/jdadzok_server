name: Lint, Format, Build, Push & Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches:
            - "**"

jobs:
    ci-check:
        name: Lint, Format, Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Run Ci fix
              run: npm run ci:fix

            - name: Build Project
              run: npm run build

    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: ci-check
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.PACKAGE_NAME }}:latest

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Copy Compose File
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  password: ${{ secrets.VPS_PASSWORD }}
                  source: "docker-compose.yaml"
                  target: "/home/${{ secrets.VPS_USER }}/jdadzok_server"
                  overwrite: true

            - name: Copy Caddy File
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  password: ${{ secrets.VPS_PASSWORD }}
                  source: "Caddyfile"
                  target: "/home/${{ secrets.VPS_USER }}/jdadzok_server"

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.VPS_HOST }}
                username: ${{ secrets.VPS_USER }}
                password: ${{ secrets.VPS_PASSWORD }}
                script: |
                  cd ~/jdadzok_server

                  # Detect docker compose command
                  if docker compose version >/dev/null 2>&1; then
                    COMPOSE_CMD="docker compose"
                  elif docker-compose version >/dev/null 2>&1; then
                    COMPOSE_CMD="docker-compose"
                  else
                    echo "❌ ERROR: docker compose or docker-compose not found"
                    exit 1
                  fi

                  echo "Using compose command: $COMPOSE_CMD"

                  # Pull latest images
                  $COMPOSE_CMD --profile prod pull

                  # Stop and remove containers safely
                  $COMPOSE_CMD --profile prod down --remove-orphans

                  # Start containers in detached mode
                  $COMPOSE_CMD --profile prod up -d

                  # Clean unused docker resources
                  docker system prune -f

    # ─────────────────────────────────────────────────────────────────────────────
    # JOB 4 — Notify success / failure via Telegram bot
    # Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
    # ─────────────────────────────────────────────────────────────────────────────
    notify:
        name: 📣 Notify Pipeline Result
        runs-on: ubuntu-latest
        needs: [ci-check, build-and-push, deploy]
        if: always() && !cancelled() && github.event_name == 'push'

        steps:
            - name: 📣 Send Telegram notification
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  CI_RESULT: ${{ needs.ci-check.result }}
                  DOCKER_RESULT: ${{ needs.build-and-push.result }}
                  DEPLOY_RESULT: ${{ needs.deploy.result }}
                  BRANCH: ${{ github.ref_name }}
                  SHA: ${{ github.sha }}
                  ACTOR: ${{ github.actor }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
                    echo "Telegram secrets not configured — skipping notification"
                    exit 0
                  fi

                  FAILED=false
                  for r in "$CI_RESULT" "$DOCKER_RESULT" "$DEPLOY_RESULT"; do
                    if [ "$r" = "failure" ]; then
                      FAILED=true
                      break
                    fi
                  done

                  if [ "$FAILED" = true ]; then
                    STATUS="❌ Synqulan Server CI/CD Failed"
                  elif [ "$CI_RESULT" = "success" ]; then
                    STATUS="✅ Synqulan Server CI/CD Succeeded"
                  else
                    echo "Nothing actionable to notify (ci=${CI_RESULT})"
                    exit 0
                  fi

                  SHORT_SHA="${SHA:0:7}"
                  TEXT="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s' \
                    "<b>${STATUS}</b>" \
                    "<b>Branch:</b> ${BRANCH}" \
                    "<b>Commit:</b> <code>${SHORT_SHA}</code>" \
                    "<b>Author:</b> ${ACTOR}" \
                    "<b>Jobs:</b> CI=${CI_RESULT} · Docker=${DOCKER_RESULT} · Deploy=${DEPLOY_RESULT}" \
                    "<a href=\"${RUN_URL}\">View run</a>")"

                  curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                    --data-urlencode "parse_mode=HTML" \
                    --data-urlencode "disable_web_page_preview=true" \
                    --data-urlencode "text=${TEXT}"

