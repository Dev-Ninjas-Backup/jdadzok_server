# coturn configuration for Synqulan calls (Issue #40).
#
# This file is a TEMPLATE. The compose service renders __TURN_SECRET__ and
# __TURN_REALM__ from the environment into /tmp/turnserver.conf at container start,
# so the shared secret stays out of this file, out of the compose file, and out of
# the turnserver process table. See docs/TURN_SETUP.md.

# --- listeners -------------------------------------------------------------
listening-port=3478

# TLS. Uncomment together with cert/pkey once you have a certificate for the realm.
# It is the only path that gets through networks blocking UDP *and* plain TCP.
#tls-listening-port=5349
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem

# Relay port range. Each concurrent allocation consumes one port, so the width is
# also the concurrency ceiling. This range must be open in the VPS firewall.
min-port=49152
max-port=65535

# --- authentication --------------------------------------------------------
# Time-limited credentials (coturn's REST form). The API server mints
#   username   = "<unix-expiry>:<identity>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# so no static password is ever shipped to a client and every credential expires.
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__TURN_REALM__

# --- identity --------------------------------------------------------------
server-name=__TURN_REALM__

# Uncomment if this VPS sits behind 1:1 NAT and `ip addr` does not show the public
# address (AWS, GCP, and some OVH/Hetzner setups). Set it to the public IP or DNS
# name, otherwise clients are handed an unreachable relay address.
#external-ip=

# --- hardening -------------------------------------------------------------
# Without these, the relay can be used to reach the VPS's own private network —
# including the cloud metadata endpoint at 169.254.169.254, which is a
# credential-theft vector.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# coturn's admin telnet CLI is unauthenticated and unused here.
no-cli
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce

# Keep output on stdout so `docker logs coturn` works.
log-file=stdout
simple-log
